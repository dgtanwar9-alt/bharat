<!DOCTYPE html>
<html lang="en">

<head>
  <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="ab3580c8-61da-4290-ba55-c97e261fc28f" type="text/javascript" async></script>
  <!--
    Reusable city template shell.
    Keep this file mostly static.
    City-specific content is injected inside #city-root by app.js.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharat Guide City Guide</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Raleway:wght@300;400;500;600;700;800&family=Cinzel:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/city-theme.css">
  <link rel="preload" href="js/cityData.js" as="script">
  <link rel="preload" href="js/app.js" as="script">
  <link rel="preload" href="assets/js/navbar.js" as="script">
  <link rel="preload" href="assets/js/script.js" as="script">
  <link rel="icon" href="assets/images/bharat-guide.svg" type="image/svg+xml">
  <meta name="smarttrip-api-base" content="https://bharat-api.onrender.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>

<!--
    Main dynamic area:
    app.js renders hero, attractions, planner, hotels, food and transport here.
    When you add a new city, you normally do NOT edit this file.
  -->
<main id="city-root"></main>

<!-- Shared footer for every city page -->
<div id="footer"></div>

<script>
fetch('footer.html')
  .then(response => response.text())
  .then(data => {
      document.getElementById('footer').innerHTML = data;
  });
</script>
<!-- Data first, then renderer logic -->
<script src="assets/js/api.js" defer></script>
<script src="js/cityData.js" defer></script>
<script src="js/app.js" defer></script>
<script src="assets/js/navbar.js" defer></script>
<script src="assets/js/script.js" defer></script>
</body>

</html>
