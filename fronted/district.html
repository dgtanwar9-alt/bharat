<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Guide - India's Premium AI Travel Planner</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cinzel:wght@700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/home.css">
    <link rel="stylesheet" href="assets/css/district-theme.css">
    <link rel="preload" href="assets/js/district.js" as="script">
    <link rel="preload" href="assets/js/navbar.js" as="script">
    <link rel="preload" href="assets/js/script.js" as="script">
    <link rel="icon" href="assets/images/bharat-guide.svg" type="image/svg+xml">
    <meta name="smarttrip-api-base" content="https://bharat-api.onrender.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>

<!-- PAGE HEADER -->
<section class="container" id="district-header" style="padding: 60px 0 40px;"></section>

<!-- TOP DESTINATIONS -->
<section class="container" id="top-places" style="margin-bottom: 80px;"></section>

<!-- MORE PLACES -->
<section class="container" id="more-places" style="margin-bottom: 80px;"></section>
<!-- FOOTER -->
<div id="footer"></div>
<script>
fetch('footer.html')
  .then(response => response.text())
  .then(data => {
      document.getElementById('footer').innerHTML = data;
  });
</script>
<script src="assets/js/api.js" defer></script>
<script src="assets/js/district.js" defer></script>
<script src="assets/js/navbar.js" defer></script>
<script src="assets/js/script.js" defer></script>
</body>

</html>
